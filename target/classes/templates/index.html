<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tokenization Demo</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --token-bg: #0ea5e9;
            --token-text: #0c4a6e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
        header { text-align: center; margin-bottom: 2.5rem; }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); margin-top: 0.25rem; font-size: 0.95rem; }
        .search-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .input-row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .input-row input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input:focus { border-color: var(--accent); }
        .input-row button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover { background: var(--accent-hover); }
        .tokenizer-options { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .tokenizer-options label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .tokenizer-options label:hover { border-color: var(--accent); }
        .tokenizer-options input:checked + span { color: var(--accent); font-weight: 600; }
        .results-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--muted);
        }
        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .result-card h3 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .result-card .description {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }
        .token-count {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        .tokens {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .token {
            background: rgba(14, 165, 233, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><span>&#x1F50D;</span> Tokenization <span>Demo</span></h1>
        <p class="subtitle">Explore how search engines break down natural language queries</p>
    </header>

    <form class="search-form" action="/tokenize" method="get">
        <div class="input-row">
            <input type="text" name="query" placeholder="Enter a search query..."
                   th:value="${query}" autofocus required/>
            <button type="submit">Tokenize</button>
        </div>
        <div class="tokenizer-options">
            <div th:each="t : ${tokenizers}">
                <label>
                    <input type="checkbox" name="tokenizers" th:value="${t}"
                           th:checked="${selectedTokenizers != null and selectedTokenizers.contains(t)}"/>
                    <span th:text="${t}">tokenizer</span>
                </label>
            </div>
        </div>
    </form>

    <div class="results-section" th:if="${results != null and !results.isEmpty()}">
        <h2>Results for &ldquo;<span th:text="${query}">query</span>&rdquo;</h2>
        <div th:each="result : ${results}" class="result-card">
            <h3 th:text="${result.tokenizerName}">Tokenizer</h3>
            <p class="description" th:text="${result.metadata['description']}">Description</p>
            <p class="token-count">
                <span th:text="${result.tokens.size()}">0</span> token(s)
            </p>
            <div class="tokens">
                <span th:each="token : ${result.tokens}" class="token" th:text="${token}">token</span>
            </div>
        </div>
    </div>

    <footer>
        <p>Tokenization Demo &mdash; A search engine tokenization demo for natural language queries</p>
    </footer>
</div>
</body>
</html>
